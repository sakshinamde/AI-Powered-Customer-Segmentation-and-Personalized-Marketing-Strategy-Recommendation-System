[project]
name = "smartseg-ai"
version = "0.1.0"
description = "AI-Powered Customer Segmentation and Marketing Strategy Recommendation System"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.8.2",
    "pydantic-settings==2.3.4",
    "sqlalchemy==2.0.31",
    "alembic==1.13.2",
    "psycopg[binary]==3.2.1",
    "psycopg2-binary==2.9.9",
    "pandas==2.2.2",
    "numpy==2.1.0",
    "scikit-learn==1.5.1",
    "kneed==0.8.5",
    "shap==0.46.0",
    "python-jose[cryptography]==3.4.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.1.2",
    "python-multipart==0.0.9",
    "openpyxl==3.1.5",
    "pytest==8.3.2",
    "httpx==0.27.0",
    "python-dotenv==1.0.1",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]

